name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    env:
      # Clerk apaga el keyless mode con `CI`/`GITHUB_ACTIONS`: hasta los E2E sin sesión necesitan las
      # claves de la instancia de **desarrollo** (`pk_test_`/`sk_test_`), nunca las de producción
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      # E2E con sesión solo si además hay una rama de Neon para tests
      HAS_CLOUD_SECRETS: ${{ secrets.E2E_DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Claves de Clerk
        if: env.CLERK_SECRET_KEY == '' || env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY == ''
        run: |
          echo "::error::Faltan los secretos E2E_CLERK_PUBLISHABLE_KEY / E2E_CLERK_SECRET_KEY (los PRs desde forks no los reciben)"
          exit 1
      # Sin sesión, con las APIs externas simuladas
      - run: pnpm test:e2e --project=local
      - name: E2E con sesión
        if: env.HAS_CLOUD_SECRETS == 'true'
        run: pnpm test:e2e --project=cloud
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
